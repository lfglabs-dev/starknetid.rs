name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed7-level33:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 0300e08d946ab80f7c9422eb6e02d628abbf54d9
          path: beal
      - name: Compute fixed-7 level-(3,3) prime-2 parity decomposition
        run: >-
          python3 beal/scripts/run_signature_357_magma_fixed7_prime2_trace.py
          > fixed7-level33-prime2-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-fixed7-level33-prime2-parity
          path: fixed7-level33-prime2-parity.json
          if-no-files-found: error

  mod5-level:
    strategy:
      fail-fast: false
      matrix:
        include:
          - pair: "3,0"
            norm: 19683
          - pair: "3,1"
            norm: 137781
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: d3624b7270c63ab51b0b6541629c52f34e0e7305
          path: beal
      - name: Compute mod-5 norm-8 parity decomposition
        working-directory: beal/scripts
        run: >-
          python3 run_signature_357_magma_mod5_norm8_probe.py
          --pair "${{ matrix.pair }}"
          > "../../mod5-norm8-${{ matrix.norm }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-norm8-${{ matrix.norm }}
          path: "mod5-norm8-${{ matrix.norm }}.json"
          if-no-files-found: error

  lmfdb-level91125:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query the official read-only LMFDB SQL mirror
        run: |
          python3 -m pip install --quiet psycopg2-binary
          python3 - <<'PY'
          import json
          import psycopg2

          conn = psycopg2.connect(
              host='devmirror.lmfdb.xyz', port=5432,
              dbname='lmfdb', user='lmfdb', password='lmfdb',
              connect_timeout=30,
          )
          conn.set_session(readonly=True, autocommit=True)
          result = {
              'source': 'official LMFDB read-only SQL mirror',
              'field_label': '2.2.5.1',
              'level_norm': 91125,
          }
          with conn.cursor() as cur:
              cur.execute("""
                  SELECT column_name, data_type
                  FROM information_schema.columns
                  WHERE table_schema='public' AND table_name='hmf_hecke'
                  ORDER BY ordinal_position
              """)
              result['hmf_hecke_schema'] = [dict(name=r[0], type=r[1]) for r in cur.fetchall()]

              cur.execute("""
                  SELECT label, level_label, level_norm, level_ideal,
                         dimension, is_cm, is_base_change
                  FROM hmf_forms
                  WHERE field_label=%s AND level_norm=%s
                  ORDER BY level_label, label
              """, ('2.2.5.1', 91125))
              cols = [d.name for d in cur.description]
              forms = [dict(zip(cols, row)) for row in cur.fetchall()]
              result['forms'] = forms
              result['form_count'] = len(forms)

              labels = [row['label'] for row in forms]
              if labels:
                  cur.execute("SELECT * FROM hmf_hecke WHERE label = ANY(%s) ORDER BY label", (labels,))
                  hcols = [d.name for d in cur.description]
                  result['hecke_rows'] = [dict(zip(hcols, row), default=str) if False else dict(zip(hcols, row)) for row in cur.fetchall()]
              else:
                  result['hecke_rows'] = []

          conn.close()

          # PostgreSQL arrays/numerics may need normalization.
          def normalize(value):
              if isinstance(value, dict):
                  return {str(k): normalize(v) for k, v in value.items()}
              if isinstance(value, (list, tuple)):
                  return [normalize(v) for v in value]
              if value is None or isinstance(value, (str, int, float, bool)):
                  return value
              return str(value)

          with open('lmfdb-level91125.json', 'w', encoding='utf-8') as f:
              json.dump(normalize(result), f, indent=2, sort_keys=True)
          print(json.dumps({'form_count': result['form_count'], 'hecke_row_count': len(result['hecke_rows'])}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-lmfdb-level91125
          path: lmfdb-level91125.json
          if-no-files-found: error
