name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod5-level19683-al:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 18529820654133c56079b4f0c1c8ed6c08f63d6b
          path: beal
      - name: Inspect the opaque AL attribute of the independent newspace
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_19683_al_probe.py
          > mod5-19683-al.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-19683-al
          path: mod5-19683-al.json
          if-no-files-found: error
