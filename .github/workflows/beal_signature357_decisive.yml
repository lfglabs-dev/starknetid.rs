name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod5-level19683-definite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: bb7be2b475438071f9afedd3f2475e82cf1fdefe
          path: beal
      - name: Force the newspace onto a definite quaternion order
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_19683_definite_probe.py
          > mod5-19683-definite.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-19683-definite
          path: mod5-19683-definite.json
          if-no-files-found: error
