name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod5-level137781-twist-corrected:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 7056e98fa0ceeee10b364acd001d5f486252488d
          path: beal
      - name: Apply eta7-corrected local polynomials and semilinear relations
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_137781_semilinear_chain_twisted.py
          > mod5-137781-twist-corrected.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-137781-twist-corrected
          path: mod5-137781-twist-corrected.json
          if-no-files-found: error
