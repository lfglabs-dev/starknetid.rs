name: Beal signature 3511 ramified-order probe

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-ramified-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ramified-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 0ef5bc10da6679ff9efc69b483f5cafc3842a381
          path: beal
      - name: Realize fixed-11 newspaces on a quaternion algebra ramified at 3 and 5
        working-directory: beal/scripts
        run: >-
          python3 run_signature_3511_magma_ramified_order_probe.py
          > ../../signature3511-ramified-order.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature3511-ramified-order
          path: signature3511-ramified-order.json
          if-no-files-found: error

  mod5-irreducibility-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: d6917e9f10226f7dc14720b54cb86e79ca792032
          path: beal
      - name: Replay the signature-(3,5,11) mod-5 irreducibility certificate
        working-directory: beal
        run: |
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py --self-test
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py
