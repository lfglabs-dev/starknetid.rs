name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod5-prime13-level137781:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: bc42650da9f5fc3ea073ea11f288285ad6e6a328
          path: beal
      - name: Install PARI/GP
        run: |
          sudo apt-get update
          sudo apt-get install -y pari-gp
      - name: Produce complete split-prime local HGM data
        working-directory: beal
        run: >-
          python3 scripts/produce_signature_357_mod5_complete_local.py
          > ../mod5-complete-local.json
      - name: Apply the prime-13 filter to the three parity eigenspaces
        working-directory: beal
        run: >-
          python3 scripts/run_signature_357_magma_mod5_prime13_parity.py
          --local-data ../mod5-complete-local.json
          > ../mod5-137781-prime13-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-137781-prime13-parity
          path: |
            mod5-complete-local.json
            mod5-137781-prime13-parity.json
          if-no-files-found: error

  mod5-level19683-ambient:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: bc42650da9f5fc3ea073ea11f288285ad6e6a328
          path: beal
      - name: Test the indefinite ambient space at norms 8 and 7
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_19683_ambient.py
          > mod5-19683-ambient.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-19683-ambient
          path: mod5-19683-ambient.json
          if-no-files-found: error

  magma-interface-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sparse Hilbert-Hecke interfaces
        run: |
          python3 - <<'PY'
          import html, http.cookiejar, re, urllib.parse, urllib.request
          url='https://magma.maths.usyd.edu.au/calc/'
          code=r'''
          _<x>:=PolynomialRing(Rationals());
          K<z>:=NumberField(x^2-5); OK:=Integers(K);
          I5:=Factorisation(5*OK)[1][1]; I2:=Factorisation(2*OK)[1][1];
          M0:=HilbertCuspForms(K,3^2*I5^2); M:=NewSubspace(M0);
          printf "TYPE=%o\n",Type(M); printf "DIM=%o\n",Dimension(M);
          try H:=HeckeImages(M,1,[I2],1); printf "HECKEIMAGES_OK=%o\n",H;
          catch e printf "HECKEIMAGES_ERROR=%o\n",e; end try;
          try T:=HeckeOperator(M,I2,1); printf "THREE_ARGUMENT_OPERATOR_OK=%o\n",T;
          catch e printf "THREE_ARGUMENT_OPERATOR_ERROR=%o\n",e; end try;
          '''
          jar=http.cookiejar.CookieJar(); opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 research'}),timeout=120) as r:
              landing=r.read().decode(errors='replace'); landing_url=r.geturl()
          form=re.search(r'<form\b([^>]*)>(.*?)</form>',landing,flags=re.I|re.S); attrs,body=form.groups()
          am=re.search(r'\baction=["\']([^"\']*)',attrs,flags=re.I)
          action=url if am is None else urllib.parse.urljoin(url,html.unescape(am.group(1)))
          hidden={}
          for tag in re.findall(r'<input\b[^>]*>',body,flags=re.I):
              tm=re.search(r'\btype=["\']([^"\']*)',tag,flags=re.I); nm=re.search(r'\bname=["\']([^"\']*)',tag,flags=re.I); vm=re.search(r'\bvalue=["\']([^"\']*)',tag,flags=re.I)
              if tm and tm.group(1).lower()=='hidden' and nm: hidden[html.unescape(nm.group(1))]='' if vm is None else html.unescape(vm.group(1))
          hidden['input']=code; parsed=urllib.parse.urlparse(action)
          req=urllib.request.Request(action,data=urllib.parse.urlencode(hidden).encode(),headers={'User-Agent':'Mozilla/5.0 research','Content-Type':'application/x-www-form-urlencoded','Referer':landing_url,'Origin':f'{parsed.scheme}://{parsed.netloc}'})
          with opener.open(req,timeout=300) as r: page=r.read().decode(errors='replace')
          text=html.unescape(re.sub(r'<[^>]+>','',page)); open('magma-interface-probe.txt','w').write(text); print(text[-10000:])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-magma-interface-probe
          path: magma-interface-probe.txt
          if-no-files-found: error
