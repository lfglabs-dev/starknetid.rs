name: Beal signature 3511 fixed-11 probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-fixed11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed11-level:
    strategy:
      fail-fast: false
      matrix:
        level: ["2,2", "2,3", "3,2", "3,3"]
        prime: [13, 29]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 1b2ff227331a4db3ec2116bd848746c029abc8d1
          path: beal
      - name: Test the complete fixed-11 residual newspace
        run: >-
          python3 beal/scripts/run_signature_3511_magma_fixed11_residual.py
          --level "${{ matrix.level }}"
          --prime "${{ matrix.prime }}"
          > "fixed11-${{ matrix.level }}-${{ matrix.prime }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "signature3511-fixed11-${{ matrix.level }}-${{ matrix.prime }}"
          path: "fixed11-${{ matrix.level }}-${{ matrix.prime }}.json"
          if-no-files-found: error
