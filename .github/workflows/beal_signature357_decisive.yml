name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modfrhil-attributes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: eadc80f07c2d26adaeb3e0edfa3f292904dccd24
          path: beal
      - name: Inspect the independently computed newspace attributes
        run: >-
          python3 beal/scripts/run_signature_357_magma_modfrhil_attributes.py
          > modfrhil-attributes.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-modfrhil-attributes
          path: modfrhil-attributes.json
          if-no-files-found: error
