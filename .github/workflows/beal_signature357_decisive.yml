name: Beal signature 3511 paired fixed-11 probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-paired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-prime:
    strategy:
      fail-fast: false
      matrix:
        level: ["2,2", "2,3", "3,2"]
        prime: [19, 29, 31, 41]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 636e6a77b4cdee82d51149113bb7ea0199acae33
          path: beal
      - name: Apply paired Galois-conjugate trace condition
        run: >-
          python3 beal/scripts/run_signature_3511_magma_fixed11_split_pair.py
          --level "${{ matrix.level }}" --prime "${{ matrix.prime }}"
          > "signature3511-pair-${{ matrix.level }}-${{ matrix.prime }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "signature3511-fixed11-pair-${{ matrix.level }}-${{ matrix.prime }}"
          path: "signature3511-pair-${{ matrix.level }}-${{ matrix.prime }}.json"
          if-no-files-found: error
