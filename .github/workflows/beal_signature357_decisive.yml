name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raw-hecke-restriction-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 767d4aadc25eac4dd4493c53c1accd30f8e7503e
          path: beal
      - name: Compare raw and ordinary Hecke restrictions
        run: >-
          python3 beal/scripts/run_signature_357_magma_hecke_raw_restriction_probe.py
          > magma-hecke-raw-restriction.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-magma-hecke-raw-restriction
          path: magma-hecke-raw-restriction.json
          if-no-files-found: error

  mod5-semilinear-chain-level137781:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: a85e7ba70e26f290ac768746b8c4a87738baeb60
          path: beal
      - name: Intersect all split-prime local and semilinear conditions
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_137781_semilinear_chain.py
          > mod5-137781-semilinear-chain.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-137781-semilinear-chain
          path: mod5-137781-semilinear-chain.json
          if-no-files-found: error
