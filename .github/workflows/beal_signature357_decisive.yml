name: Beal signature 357 decisive probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature357-decisive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mod5-level19683-hecke-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 133d3ab8eca598b0d7ce32eac107f18cd15fd0c5
          path: beal
      - name: Catch the norm-8 failure and inspect every partial Hecke cache
        run: >-
          python3 beal/scripts/run_signature_357_magma_mod5_19683_hecke_cache_probe.py
          > mod5-19683-hecke-cache.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature357-mod5-19683-hecke-cache
          path: mod5-19683-hecke-cache.json
          if-no-files-found: error
