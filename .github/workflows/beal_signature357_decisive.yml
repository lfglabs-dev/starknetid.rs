name: Beal signature 3511 exact-conductor order probe

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-exact-order-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ramified-order:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 51222477ab2b7ad8ecb1f0605f8f7137f775db06
          path: beal
      - name: Realize newspaces on the exact-conductor ramified Eichler orders
        working-directory: beal/scripts
        run: >-
          python3 run_signature_3511_magma_ramified_order_probe.py
          > ../../signature3511-ramified-order.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature3511-ramified-order
          path: signature3511-ramified-order.json
          if-no-files-found: error
