name: Beal signature 3511 extended paired chain

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-extended-paired-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired-chain:
    strategy:
      fail-fast: false
      matrix:
        level: ["2,2", "2,3", "3,2"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 3e0b233a02365b1a39200518119a87dc15ad3c37
          path: beal
      - name: Intersect the extended paired split-prime conditions
        run: >-
          python3 beal/scripts/run_signature_3511_magma_fixed11_split_pair_extended.py
          --level "${{ matrix.level }}"
          > "signature3511-extended-paired-${{ matrix.level }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: "signature3511-fixed11-extended-paired-${{ matrix.level }}"
          path: "signature3511-extended-paired-${{ matrix.level }}.json"
          if-no-files-found: error
