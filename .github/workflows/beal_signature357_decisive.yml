name: Beal signature 3511 raw Brandt probes

on:
  push:
    branches:
      - research/beal-signature357-probe
  pull_request:
    paths:
      - ".github/workflows/beal_signature357_decisive.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beal-signature3511-raw-brandt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raw-prime2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: 219b0587aae91d5a3972c909834986bc62f881d2
          path: beal
      - name: Compute the level-(3,3) norm-4 cover after freeing rational spaces
        working-directory: beal/scripts
        run: >-
          python3 run_signature_3511_magma_level33_raw_prime2.py
          > ../../signature3511-level33-raw-prime2.json
      - uses: actions/upload-artifact@v4
        with:
          name: signature3511-level33-raw-prime2
          path: signature3511-level33-raw-prime2.json
          if-no-files-found: error

  mod5-irreducibility-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Th0rgal/beal-conjecture-lean
          ref: d6917e9f10226f7dc14720b54cb86e79ca792032
          path: beal
      - name: Replay the signature-(3,5,11) mod-5 irreducibility certificate
        working-directory: beal
        run: |
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py --self-test
          python3 scripts/check_signature_3511_mod5_irreducibility_at3.py
